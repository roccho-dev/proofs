name: proofs
on:
  push:
    branches: [main, 'proof/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: '1.3.0'
      - name: Install fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y strace
          mkdir -p .tools evidence/toolchain
          curl -fL --retry 2 https://github.com/tlaplus/tlapm/releases/download/1.6.0-pre/tlapm-1.6.0-pre-x86_64-linux-gnu.tar.gz -o .tools/tlapm.tar.gz
          echo 'd1f0c863d3e64a4cf731f953367e5055f39fab7417c2c7097fd53a0ef288a50a  .tools/tlapm.tar.gz' | sha256sum -c -
          tar -xzf .tools/tlapm.tar.gz -C .tools
          cp package-lock.json evidence/toolchain/
          .tools/tlapm/bin/tlapm --version | tee evidence/toolchain/version.txt
          .tools/tlapm/bin/tlapm --config > evidence/toolchain/config.txt 2>&1
          cat evidence/toolchain/config.txt
      - name: Run dependency controls
        run: ${{ matrix.runtime }} run.mjs
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.runtime }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
