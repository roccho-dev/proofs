name: quint dependencies
on:
  push:
    branches: ['proof/quint-dependencies']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: matrix.runtime == 'bun'
        with:
          bun-version: '1.3.0'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Quint CLI
        run: |
          set -euo pipefail
          mkdir -p quint/evidence
          npm install --prefix quint --no-save --ignore-scripts --no-audit --no-fund @informalsystems/quint@0.33.1
          command -v strace || (sudo apt-get update -qq && sudo apt-get install -y strace)
          npm ls --prefix quint @informalsystems/quint --json > quint/evidence/dependency.json
          java -version 2> quint/evidence/java.txt
      - name: Dependency controls
        run: ${{ matrix.runtime }} quint/run.mjs
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quint-${{ matrix.runtime }}
          path: quint/evidence/
          if-no-files-found: error
          retention-days: 30
